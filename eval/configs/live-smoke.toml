# A cheap check that live calls work end to end: one scenario, one seed, 20 decisions.
name = "live-smoke"
scenarios = ["level01-cp1"]
seeds = [0]
difficulty = "hard"
isolation = "process"
decision_timeout = 60.0
reference = "scripted"

[budgets]
max_decisions = 20
max_input_tokens = 80000
max_output_tokens = 25000

[run]
max_input_tokens = 80000
max_output_tokens = 25000

[prices]                  # Vertex AI, Gemini 3.5 Flash-Lite, global endpoint, standard tier ("Text output" includes reasoning)
date = "2026-10-26"
source = "https://cloud.google.com/vertex-ai/generative-ai/pricing"
input_per_mtok = 0.30
output_per_mtok = 2.50

[[players]]
label = "scripted"
player = "scripted"

[[players]]
label = "model-M1"
player = "model"
args = ["--provider", "vertex", "--memory", "M1", "--timeout", "20", "--max-output-tokens", "2048"]
live = true
