name: Release

# Builds the playable game for Linux, macOS and Windows when the student pushes a version tag
# (agents never push tags):
#   git tag -a v1.0.0 -m "Abuse remake v1.0.0" && git push origin v1.0.0
# Each build runs the deterministic tests, bundles the public-domain data, starts the bundle
# headless as a smoke test, and attaches an archive to a GitHub Release for the tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Deterministic tests
        run: uv run --frozen pytest -q
      - name: Bundle with PyInstaller
        run: |
          sep=":"; [ "$RUNNER_OS" = "Windows" ] && sep=";"
          uv run --frozen --with "pyinstaller>=6.10,<7" pyinstaller packaging/abuse_remake_main.py \
            --name abuse-remake --onefile --noconfirm --clean --log-level WARN \
            --collect-submodules abuse_remake --add-data "data/original${sep}data/original" \
            --add-data "assets/neon${sep}assets/neon" \
            --exclude-module google --exclude-module anthropic --exclude-module openai
      - name: Smoke test the bundle
        run: |
          exe=dist/abuse-remake; [ "$RUNNER_OS" = "Windows" ] && exe=dist/abuse-remake.exe
          mkdir -p smoke && cd smoke
          "../$exe" --frames 40 --no-audio --scale 1 --screenshot shot.png
          test -s shot.png
          "../$exe" --mode neon --frames 40 --no-audio --scale 1 --screenshot neon-campaign.png
          "../$exe" --mode neon --horde --frames 100 --no-audio --scale 1 --screenshot neon-horde.png
          "../$exe" --mode neon --tutorial --frames 40 --no-audio --scale 1 --screenshot neon-training.png
          test -s neon-campaign.png && test -s neon-horde.png && test -s neon-training.png
      - name: Package
        run: |
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')  # bash 3 on macOS has no ${x,,}
          name="abuse-remake-${GITHUB_REF_NAME}-${os}"
          mkdir -p "pkg/$name"
          cp dist/abuse-remake* "pkg/$name/"
          cp README.md SCOPE.md docs/remastered.md docs/neon-protocol.md "pkg/$name/"
          cp data/original/PROVENANCE.md data/original/COPYING.upstream "pkg/$name/"
          cp assets/neon/PROVENANCE.md "pkg/$name/NEON-ASSET-CREDITS.md"
          mkdir -p "pkg/$name/neon-licenses"
          cp assets/neon/city/public-license.txt "pkg/$name/neon-licenses/Warped-City.txt"
          cp assets/neon/city2/public-license.txt "pkg/$name/neon-licenses/Warped-City-2.txt"
          cp assets/neon/lab/public-license.txt "pkg/$name/neon-licenses/Warped-Sci-Fi-Lab.txt"
          cd pkg
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            pkg/*.zip
            pkg/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release for this tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "Abuse remake $GITHUB_REF_NAME" \
            --notes "Playable build: Abuse Level 1 (Classic/Remastered) and Neon Protocol (campaign/Horde/tutorial). Run the binary; see README.md inside the archive. Built from ${GITHUB_SHA}."
